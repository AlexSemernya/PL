<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LifeOS — Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><circle cx='60' cy='60' r='46' stroke='%2326272c' stroke-width='10' fill='none'/><circle cx='60' cy='60' r='30' stroke='%2326272c' stroke-width='10' fill='none'/><path d='M 60 14 A 46 46 0 0 1 106 60' stroke='%23C6F84E' stroke-width='10' fill='none' stroke-linecap='round'/><path d='M 30 60 A 30 30 0 0 1 60 30' stroke='%234CD6FF' stroke-width='10' fill='none' stroke-linecap='round'/></svg>">

<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* ───────── Reset / viewport ───────── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: #0a0a0b;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }

/* ───────── Design tokens (from styles.css) ───────── */
:root {
  --bg: #0a0a0b;
  --panel: #141518;
  --panel-2: #1c1d21;
  --line: #26272c;
  --line-2: #34353b;
  --text: #f4f4f5;
  --text-dim: #8b8c92;
  --text-faint: #5a5b62;
  --accent: #c6f84e;
  --accent-ink: #0a0a0b;
  --warn: #ff8a3d;
  --pink: #ff5a8a;
  --cyan: #4cd6ff;
  --violet: #b59cff;
  --red: #ff5252;
  --good: #6be99a;

  /* Telegram-safe inset support */
  --tg-vh: 100vh;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

body, .planner-app {
  font-family: -apple-system, system-ui, "SF Pro Display", "Helvetica Neue", "Inter", "Roboto", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
  letter-spacing: -0.01em;
}

.num, .mono {
  font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

#root {
  width: 100%;
  height: 100%;
  height: var(--tg-vh);
  background: var(--bg);
}

/* ───────── App shell ───────── */
.planner-app {
  background: var(--bg);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Scroll body */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 14px calc(110px + var(--safe-bottom));
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.scroll::-webkit-scrollbar { display: none; }

/* Top brand strip */
.app-brand {
  display: flex; align-items: center; gap: 8px;
  padding: calc(14px + var(--safe-top)) 18px 0;
  background: var(--bg);
  font-family: "SF Mono", ui-monospace, monospace;
}
.app-brand-name {
  font-family: -apple-system, system-ui, sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--text);
}
.app-brand-dot { color: var(--text-faint); margin: 0 -2px; }
.app-brand-meta { font-size: 10px; color: var(--text-faint); letter-spacing: 0.06em; }
.app-brand-spacer { flex: 1; }

.app-header {
  padding: 14px 18px 8px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
}
.app-header .month { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.app-header .month .year { color: var(--text-faint); font-weight: 500; margin-left: 4px; }
.app-header .nav-arrows { display: flex; gap: 6px; }
.app-header .arrow {
  width: 30px; height: 30px; border-radius: 10px;
  background: var(--panel); display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 14px;
  cursor: pointer; transition: background 0.15s, transform 0.1s;
}
.app-header .arrow:active { background: var(--panel-2); transform: scale(0.94); }

/* Week strip */
.week-strip {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 8px 14px 12px;
  background: var(--bg);
}
.week-day {
  border-radius: 14px;
  background: transparent;
  padding: 8px 0 10px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.week-day:active { transform: scale(0.95); }
.week-day .wd-name {
  font-size: 10px; color: var(--text-faint); text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600;
}
.week-day .wd-num { font-size: 17px; font-weight: 600; line-height: 1; }
.week-day .wd-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-faint); }
.week-day.today { background: var(--panel); }
.week-day.today .wd-name { color: var(--accent); }
.week-day.today .wd-dot { background: var(--accent); }
.week-day.active { background: var(--accent); }
.week-day.active .wd-name { color: rgba(10,10,11,0.7); }
.week-day.active .wd-num { color: var(--accent-ink); }
.week-day.active .wd-dot { background: var(--accent-ink); }

/* Widget cards */
.widget {
  background: var(--panel);
  border-radius: 22px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.widget.tight { padding: 12px; }
.widget.compact { padding: 10px 12px; }
.widget.flat { background: var(--panel-2); }

.w-row { display: flex; align-items: center; gap: 8px; }
.w-row.between { justify-content: space-between; }
.w-row.baseline { align-items: baseline; }

.w-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.w-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-dim);
  display: inline-flex; align-items: center; gap: 4px;
}
.w-title.accent { color: var(--accent); }
.w-title.orange { color: var(--warn); }
.w-title.cyan { color: var(--cyan); }
.w-title.pink { color: var(--pink); }
.w-title.violet { color: var(--violet); }
.w-title.red { color: var(--red); }
.w-title.good { color: var(--good); }

.w-big { font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.w-mid { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.w-unit { font-size: 11px; color: var(--text-dim); font-weight: 500; }
.w-label { font-size: 11px; color: var(--text-faint); }
.w-sub { font-size: 13px; color: var(--text-dim); }

.w-grid { display: grid; gap: 8px; margin-bottom: 8px; }
.w-grid.c2 { grid-template-columns: 1fr 1fr; }
.w-grid.c3 { grid-template-columns: 1fr 1fr 1fr; }

/* Chart primitives */
.bar-row {
  display: grid; grid-template-columns: repeat(7, 1fr);
  align-items: end; gap: 4px;
  height: 56px;
}
.bar { background: var(--line-2); border-radius: 3px; width: 100%; min-height: 4px; }
.bar.accent { background: var(--accent); }
.bar.dim { background: var(--line); }
.bar.orange { background: var(--warn); }
.bar.cyan { background: var(--cyan); }
.bar.pink { background: var(--pink); }
.bar.violet { background: var(--violet); }
.bar-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.bar-labels span { text-align: center; font-size: 10px; color: var(--text-faint); font-weight: 600; }
.bar-labels span.hot { color: var(--text); }

.tick-row { display: flex; align-items: end; gap: 2px; height: 36px; width: 100%; }
.tick { flex: 1; background: var(--line-2); border-radius: 1px; min-height: 2px; }
.tick.accent { background: var(--accent); }
.tick.pink { background: var(--pink); }
.tick.orange { background: var(--warn); }
.tick.violet { background: var(--violet); }
.tick.cyan { background: var(--cyan); }

/* Ring */
.ring { position: relative; width: var(--ring-size, 60px); height: var(--ring-size, 60px); }
.ring svg { display: block; }
.ring .label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
}

.h-progress {
  height: 8px; background: var(--line); border-radius: 6px; overflow: hidden;
  position: relative;
}
.h-progress > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.h-progress.thick { height: 12px; }

.segmented {
  display: inline-flex; padding: 3px; background: var(--panel-2);
  border-radius: 14px; gap: 2px;
}
.segmented button {
  border: 0; background: transparent; color: var(--text-dim);
  padding: 7px 14px; font-size: 12px; font-weight: 600;
  border-radius: 11px; cursor: pointer; letter-spacing: -0.01em;
  transition: background 0.15s, color 0.15s;
}
.segmented button.on { background: var(--accent); color: var(--accent-ink); }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 999px;
  background: var(--panel-2); color: var(--text-dim);
  font-size: 11px; font-weight: 600;
}
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.pill.dim { background: var(--line); }
.pill.outline { background: transparent; border: 1px solid var(--line-2); }

.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #2a2c33, #1a1b1f);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text-dim);
  flex-shrink: 0;
}
.avatar.lime { background: var(--accent); color: var(--accent-ink); }

.sec-h {
  display: flex; justify-content: space-between; align-items: baseline;
  margin: 18px 4px 10px;
}
.sec-h .t { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.sec-h .a { font-size: 12px; color: var(--text-dim); font-weight: 500; cursor: pointer; }

.check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.6px solid var(--line-2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform 0.1s, background 0.2s;
}
.check:active { transform: scale(0.88); }
.check.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.lrow {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--panel);
  cursor: pointer;
  transition: background 0.15s;
}
.lrow:active { background: var(--panel-2); }
.lrow + .lrow { margin-top: 6px; }
.lrow .meta { flex: 1; min-width: 0; }
.lrow .t1 { font-size: 14px; font-weight: 600; line-height: 1.2; }
.lrow .t2 { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.lrow.done .t1 { color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--line-2); }

.fab {
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 14px;
  border-radius: 18px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 14px;
  border: 0; cursor: pointer;
  transition: transform 0.1s, opacity 0.15s;
}
.fab:active { transform: scale(0.97); opacity: 0.9; }
.fab.ghost { background: var(--panel); color: var(--text); }

/* Bottom tab bar */
.tabbar {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 14px calc(14px + var(--safe-bottom));
  background: linear-gradient(180deg, rgba(10,10,11,0) 0%, rgba(10,10,11,0.96) 30%);
  z-index: 30;
  pointer-events: none;
}
.tabbar-inner {
  display: flex; justify-content: space-around;
  background: rgba(28,29,33,0.92);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-radius: 22px;
  padding: 8px 6px;
  pointer-events: auto;
  border: 1px solid rgba(255,255,255,0.04);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 6px; border-radius: 14px;
  color: var(--text-faint); font-size: 9px; font-weight: 600;
  letter-spacing: 0.03em; text-transform: uppercase;
  cursor: pointer; border: 0; background: transparent;
  flex: 1; min-width: 0;
  transition: color 0.15s, transform 0.1s;
}
.tab:active { transform: scale(0.92); }
.tab svg { display: block; }
.tab.on { color: var(--accent); }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* Habit grid heatmap */
.habit-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.habit-cell { aspect-ratio: 1; border-radius: 3px; background: var(--line); }
.habit-cell.l1 { background: rgba(198,248,78,0.20); }
.habit-cell.l2 { background: rgba(198,248,78,0.45); }
.habit-cell.l3 { background: rgba(198,248,78,0.75); }
.habit-cell.l4 { background: var(--accent); }

.mood-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 6px; }

/* Screen transitions */
.screen-enter { animation: fadein 0.2s ease-out; }
@keyframes fadein { from { opacity: 0.6; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* small phones */
@media (max-width: 360px) {
  .tab { padding: 8px 3px; font-size: 8px; }
  .w-big { font-size: 28px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
/* ═══════════════════════════════════════════════════════════════
   Telegram Mini App integration
═══════════════════════════════════════════════════════════════ */
const tg = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) || null;

function setupTelegram() {
  if (!tg) return;
  try {
    tg.ready();
    tg.expand();
    if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch(e){} }
    if (tg.setHeaderColor) tg.setHeaderColor('#0a0a0b');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0a0a0b');
    if (tg.setBottomBarColor) tg.setBottomBarColor('#0a0a0b');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    // Sync viewport height to a CSS var so layouts stay correct when keyboard opens.
    const syncVH = () => {
      const h = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
      document.documentElement.style.setProperty('--tg-vh', h + 'px');
    };
    syncVH();
    tg.onEvent && tg.onEvent('viewportChanged', syncVH);
    window.addEventListener('resize', syncVH);
  } catch (e) {
    console.warn('Telegram setup error', e);
  }
}

function haptic(kind = 'light') {
  try {
    if (tg && tg.HapticFeedback) {
      if (kind === 'select') tg.HapticFeedback.selectionChanged();
      else if (kind === 'success' || kind === 'warning' || kind === 'error')
        tg.HapticFeedback.notificationOccurred(kind);
      else tg.HapticFeedback.impactOccurred(kind);
    }
  } catch (e) {}
}

setupTelegram();

/* ═══════════════════════════════════════════════════════════════
   Constants + Icons
═══════════════════════════════════════════════════════════════ */
const RU_WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const RU_WD_SHORT = ["П","В","С","Ч","П","С","В"];

function Icon({ name, size = 20, color = 'currentColor', stroke = 1.8 }) {
  const props = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'home':    return <svg {...props}><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"/></svg>;
    case 'check':   return <svg {...props}><path d="M9 11l3 3 7-7M5 19h14"/></svg>;
    case 'target':  return <svg {...props}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill={color} stroke="none"/></svg>;
    case 'wallet':  return <svg {...props}><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M17 15h2"/></svg>;
    case 'book':    return <svg {...props}><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM5 17a3 3 0 0 0 3 3"/></svg>;
    case 'plus':    return <svg {...props}><path d="M12 5v14M5 12h14"/></svg>;
    case 'chev-l':  return <svg {...props}><path d="M15 18l-6-6 6-6"/></svg>;
    case 'chev-r':  return <svg {...props}><path d="M9 18l6-6-6-6"/></svg>;
    case 'flame':   return <svg {...props}><path d="M12 3s4 4 4 9a4 4 0 0 1-8 0c0-2 1-3 1-3s0 2 2 2-1-5 1-8z"/></svg>;
    case 'drop':    return <svg {...props}><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>;
    case 'moon':    return <svg {...props}><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/></svg>;
    case 'book2':   return <svg {...props}><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2V5z"/><path d="M8 7h7M8 11h7M8 15h5"/></svg>;
    case 'run':     return <svg {...props}><circle cx="15" cy="4" r="2"/><path d="M9 19l1-4 3-2-2-4-4 2-1 3M14 13l3 2v4"/></svg>;
    case 'bell':    return <svg {...props}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8zM10 21a2 2 0 0 0 4 0"/></svg>;
    case 'edit':    return <svg {...props}><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>;
    case 'mic':     return <svg {...props}><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>;
    case 'arrow-r': return <svg {...props}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
    case 'arrow-u': return <svg {...props}><path d="M7 14l5-5 5 5"/></svg>;
    case 'arrow-d': return <svg {...props}><path d="M7 10l5 5 5-5"/></svg>;
    case 'dots':    return <svg {...props}><circle cx="6" cy="12" r="1.6" fill={color}/><circle cx="12" cy="12" r="1.6" fill={color}/><circle cx="18" cy="12" r="1.6" fill={color}/></svg>;
    case 'star':    return <svg {...props}><path d="M12 3l2.5 6 6.5.5-5 4.5 1.5 6.5L12 17l-5.5 3.5L8 14 3 9.5 9.5 9z"/></svg>;
    case 'coffee':  return <svg {...props}><path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8zM17 10h2a2 2 0 0 1 0 4h-2M7 3v2M11 3v2M15 3v2"/></svg>;
    case 'mood':    return <svg {...props}><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/></svg>;
    case 'food':    return <svg {...props}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a9 9 0 0 1 0 18M12 3a9 9 0 0 0 0 18"/></svg>;
    case 'bag':     return <svg {...props}><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></svg>;
    case 'card':    return <svg {...props}><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>;
    case 'gift':    return <svg {...props}><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 12h18M12 8v13M12 8s-3-5-5-3 1 3 5 3zM12 8s3-5 5-3-1 3-5 3z"/></svg>;
    case 'film':    return <svg {...props}><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>;
    case 'note':    return <svg {...props}><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>;
    case 'shoe':    return <svg {...props}><path d="M3 18l1-3 3-1 2-4 4 1 1 3 6 2v3H3z"/></svg>;
    default: return null;
  }
}

/* ═══════════════════════════════════════════════════════════════
   Reusable widgets
═══════════════════════════════════════════════════════════════ */
function LifeOSMark({ size = 24 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" aria-label="LifeOS">
      <circle cx="60" cy="60" r="46" stroke="#26272c" strokeWidth="6" fill="none"/>

function BarChart({ values, accent = 'accent', labels = RU_WD_SHORT, hot = -1 }) {
  const max = Math.max(...values, 1);
  return (
    <div>
      <div className="bar-row">
        {values.map((v, i) => (
          <div key={i} className="bar" style={{
            height: `${Math.max(8, (v / max) * 100)}%`,
            background: `var(--${accent === 'accent' ? 'accent' : accent})`,
            opacity: i === hot ? 1 : (v > 0 ? 0.5 : 0.15),
          }}/>
        ))}
      </div>
      <div className="bar-labels">
        {labels.map((l, i) => <span key={i} className={i === hot ? 'hot' : ''}>{l}</span>)}
      </div>
    </div>
  );
}

function TickRow({ values, color = 'accent', height = 36 }) {
  const max = Math.max(...values, 1);
  return (
    <div className="tick-row" style={{ height }}>
      {values.map((v, i) => (
        <div key={i} className={`tick ${color}`} style={{ height: `${Math.max(6, (v / max) * 100)}%` }} />
      ))}
    </div>
  );
}

function Ring({ value, size = 60, stroke = 7, color = 'var(--accent)', label, sublabel, track = 'var(--line)' }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, value));
  return (
    <div className="ring" style={{ '--ring-size': `${size}px` }}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`} />
      </svg>
      <div className="label" style={{ flexDirection: 'column', gap: 0 }}>
        <span style={{ fontSize: size > 80 ? 18 : 13, fontWeight: 700 }}>{label}</span>
        {sublabel && <span style={{ fontSize: 9, color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '0.08em', marginTop: 1 }}>{sublabel}</span>}
      </div>
    </div>
  );
}

function Sparkline({ values, color = 'var(--accent)', height = 40, fill = true }) {
  const w = 100, h = height;
  const min = Math.min(...values), max = Math.max(...values);
  const rng = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / rng) * (h - 4) - 2;
    return [x, y];
  });
  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');
  const area = path + ` L ${w},${h} L 0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} preserveAspectRatio="none">
      {fill && <path d={area} fill={color} opacity="0.18" />}
      <path d={path} fill="none" stroke={color} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.2" fill={color} />
    </svg>
  );
}

// deterministic pseudo-random pattern for heatmap (stable across renders)
const HEATMAP = (() => {
  const cells = [];
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < 60; i++) {
    const r = Math.floor(rnd() * 5);
    const level = i < 20 ? 0 : (i < 30 ? Math.min(r, 2) : r);
    cells.push(level);
  }
  return cells;
})();

const TABS = [
  { id: 'home',    label: 'Главная',  icon: 'home',   Comp: ScreenHome },
  { id: 'habits',  label: 'Привычки', icon: 'check',  Comp: ScreenHabits },
  { id: 'goals',   label: 'Цели',     icon: 'target', Comp: ScreenGoals },
  { id: 'finance', label: 'Финансы',  icon: 'wallet', Comp: ScreenFinance },
  { id: 'diary',   label: 'Дневник',  icon: 'book2',  Comp: ScreenDiary },
];

function PlannerApp() {
  const [tab, setTab] = React.useState('home');
  const Current = TABS.find(x => x.id === tab).Comp;

  const switchTab = (id) => {
    if (id === tab) return;
    setTab(id);
    haptic('select');
  };

  return (
    <StoreProvider>
      <div className="planner-app">
        <Current key={tab} />
        <div className="tabbar">
          <div className="tabbar-inner">
            {TABS.map(tt => (
              <button key={tt.id}
                className={`tab ${tab === tt.id ? 'on' : ''}`}
                onClick={() => switchTab(tt.id)}>
                <Icon name={tt.icon} size={22}
                  color={tab === tt.id ? 'var(--accent)' : 'var(--text-faint)'}
                  stroke={tab === tt.id ? 2.2 : 1.8}/>
                <span style={{ marginTop: 4 }}>{tt.label}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    </StoreProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PlannerApp />);
